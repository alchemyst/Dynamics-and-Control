name: Run tests

# Restricting push to master matters: with an unrestricted push trigger, every
# branch that also has a pull request open runs the whole suite twice over the
# same commit.
on:
  push:
    branches: [master]
  pull_request:

# Superseded runs are of no interest, and the notebook job is not cheap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  library:
    name: tbcontrol / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.11.29"

      - name: Install the locked library test environment
        run: uv sync --locked --no-default-groups --group test

      - name: Run package tests
        run: uv run --locked --no-default-groups --group test pytest tests

  notebooks:
    name: Notebooks / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # MPLBACKEND is deliberately not set. Inside a kernel the default is the
    # inline backend, which is what a reader sees; forcing Agg suppresses inline
    # figure capture in any notebook that does not declare %matplotlib itself,
    # and the suite only checks for exceptions so it would never notice.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.11.29"

      - name: Install the locked notebook test environment
        run: uv sync --locked --group test --group notebook-test

      # ubuntu-latest gives public repositories four vCPUs, so -n 2 left half the
      # runner idle. The floor is now the slowest single notebook rather than the
      # worker count.
      - name: Run notebook tests
        run: uv run --locked --group test --group notebook-test pytest -n auto --verbose test_all_notebooks.py
